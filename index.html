<!DOCTYPE html>
<!--
  index.html — the holding page.

  Shown on theplanthub.co until the first version of the site is ready.
  One wordmark and one line, nothing to click. It has no light/dark switch,
  so it simply follows the device's own setting.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlantHub</title>
  <meta name="description" content="PlantHub is coming soon.">
  <meta name="theme-color" content="#f8f8f5">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400&display=swap" rel="stylesheet">

  <style>
    :root {
      --page: #f8f8f5;   /* off-white */
      --text: #0b1710;   /* near-black green */
      --quiet: #4a6b5a;  /* muted green-grey */
      --dot: #22c55e;    /* the fresh-listing green */
    }
    @media (prefers-color-scheme: dark) {
      :root { --page: #060f0a; --text: #f5f5f4; --quiet: #a8a29e; }
    }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 16px 8vh;
      box-sizing: border-box;
      text-align: center;
    }
    h1 {
      font-family: Fraunces, ui-serif, Georgia, serif;
      font-weight: 600;
      letter-spacing: -0.02em;
      font-size: clamp(3rem, 12vw, 4.5rem);
      line-height: 1;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    /* The green dot from the logo. */
    h1 span {
      width: 0.22em;
      height: 0.22em;
      border-radius: 50%;
      background: var(--dot);
      flex-shrink: 0;
    }
    p { margin: 1rem 0 0; color: var(--quiet); font-size: 1.125rem; }
  </style>
</head>
<body>
  <h1>PlantHub<span aria-hidden="true"></span></h1>
  <p>Coming soon.</p>
</body>
</html>
