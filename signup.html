<!DOCTYPE html>
<!--
  signup.html — create a grower account.

  One form: company name, email, and the password typed twice. Only growers can sign up for now, so
  there is no question about what kind of account it is.

  "Create account" asks the database to make it. If the email has to be
  confirmed first, the page says to check for the link; the link lands on
  signin.html, which signs the grower in and opens their account page.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an account - PlantHub</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex flex-col bg-cream text-ink-900 dark:bg-ink-950 dark:text-stone-100 font-sans antialiased">

  <header class="page flex items-center justify-between py-4">
    <a href="index.html" class="font-display font-semibold text-xl tracking-tight inline-flex items-center gap-2 hover:text-clay-700 dark:hover:text-clay-300">
      PlantHub<span class="w-2 h-2 rounded-full bg-signal-500" aria-hidden="true"></span>
    </a>
    <div class="flex items-center gap-3">
      <a href="signin.html" id="signin-link" class="text-sm auth-link"><span class="hidden sm:inline">Already have an account? </span>Sign in</a>
      <!-- The light-or-dark switch (store.js draws it). -->
      <div data-theme-toggle></div>
    </div>
  </header>

  <main class="page flex-1 flex flex-col items-center justify-center pb-16">
    <section class="w-full max-w-md">
      <!-- Takes the form's place when the email has to be confirmed first. -->
      <div id="check-email" hidden class="auth-card">
        <h1 class="font-display font-semibold text-2xl tracking-tight">Check your email</h1>
        <p class="mt-2 text-sm text-ink-700 dark:text-stone-300">
          We sent a link to <strong id="sent-to"></strong>. Open it to finish making your account. It can take a minute, and may land in spam.
        </p>
        <p id="resend-note" role="status" hidden class="auth-note mt-4"></p>
        <button type="button" id="resend" class="auth-link text-sm mt-4">Send the link again</button>
      </div>

      <div id="signup-card" class="auth-card">
        <h1 class="font-display font-semibold text-2xl tracking-tight">Create your grower account</h1>

        <form id="signup-form" class="mt-6 space-y-4" novalidate>
          <div>
            <label class="auth-label" for="name">Company name</label>
            <input class="auth-input" id="name" type="text" maxlength="120" autocomplete="organization">
          </div>
          <div>
            <label class="auth-label" for="email">Email</label>
            <input class="auth-input" id="email" type="email" maxlength="254" autocomplete="email">
          </div>
          <div>
            <label class="auth-label" for="password">Password</label>
            <input class="auth-input" id="password" type="password" autocomplete="new-password">
            <p class="auth-hint">At least 8 characters.</p>
          </div>
          <div>
            <label class="auth-label" for="password-again">Confirm password</label>
            <input class="auth-input" id="password-again" type="password" autocomplete="new-password">
          </div>

          <p id="form-error" role="alert" hidden class="auth-error"></p>

          <button type="submit" id="signup-button" class="auth-button">Create account</button>
        </form>
      </div>

    </section>
  </main>

  <footer class="page py-6 text-center text-[13px] text-ink-400 dark:text-stone-500">
    <p data-site-footer></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js" integrity="sha384-UagCvVPT5XXA0Hx+nJYUAGBFseHT9zBgpJMSebsAxl9lciTwbT+39j5VfRjdP5Tp" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="store.js"></script>
  <script>
    // Already signed in? There is nothing to do here.
    PH.ready.then(function () {
      if (PH.currentUser()) location.replace(PH.nextPage("inventory.html"));
    });

    // Keep the "come back here afterwards" page when moving to sign-in.
    if (location.search) document.getElementById("signin-link").href = "signin.html" + location.search;

    const errorBox = document.getElementById("form-error");

    // Check the answers and ask for the account.
    document.getElementById("signup-form").addEventListener("submit", async function (event) {
      event.preventDefault();

      // A slip in a password can't be seen, so it is typed twice.
      const password = document.getElementById("password").value;
      if (password && password !== document.getElementById("password-again").value) {
        errorBox.textContent = "The two passwords don't match. Type them again.";
        errorBox.hidden = false;
        document.getElementById("password-again").value = "";
        document.getElementById("password-again").focus();
        return;
      }

      const result = await PH.whileBusy(document.getElementById("signup-button"), "Creating your account…", function () {
        return PH.signUp({
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        });
      });
      if (!result.ok) {
        errorBox.textContent = result.error;
        errorBox.hidden = false;
        if (result.field) document.getElementById(result.field).focus();
        return;
      }
      if (result.needsConfirm) {
        document.getElementById("sent-to").textContent = result.email;
        document.getElementById("signup-card").hidden = true;
        document.getElementById("check-email").hidden = false;
        return;
      }
      location.href = PH.nextPage("inventory.html?welcome=1");
    });

    document.getElementById("resend").addEventListener("click", async function (event) {
      const email = document.getElementById("sent-to").textContent;
      const result = await PH.whileBusy(event.target, "Sending…", function () { return PH.resendConfirmation(email); });
      const note = document.getElementById("resend-note");
      note.textContent = result.ok ? "Sent again." : result.error;
      note.hidden = false;
    });
  </script>
</body>
</html>
